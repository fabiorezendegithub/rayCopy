[package]
name = "raycopy"
version = "0.1.0"
edition = "2021"
description = "rayCopy: create beautiful images of your code (a Rust port of ray.so)"
license = "MIT"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
resvg = "0.45"
usvg = "0.45"
tiny-skia = "0.11"
fontdb = "0.23"
rfd = "0.15"
arboard = "3"
png = "0.17"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = 3
